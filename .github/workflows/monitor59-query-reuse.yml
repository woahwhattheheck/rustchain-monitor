name: Monitor59 comparison query reuse

on:
  push:
    branches: [harbor6483/monitor59-query-reuse-validation]
    paths:
      - rustchain_monitor.py
      - benchmarks/monitor59_query_reuse.py
      - .github/workflows/monitor59-query-reuse.yml

permissions:
  contents: read

concurrency:
  group: monitor59-query-reuse-validation
  cancel-in-progress: false

jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install declared dependencies and pytest
        run: python -m pip install -r requirements.txt pytest
      - name: Run existing comparison regression module
        run: python -m pytest tests/test_comparison_periods.py -q
      - name: Benchmark full comparison calls with real SQLite
        run: python benchmarks/monitor59_query_reuse.py
