name: Z Vector reconciliation hardlink repair

on:
  push:
    branches:
      - z-vector/reconciliation-nlink-repair-20260914

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: z-vector/reconciliation-nlink-repair-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact reviewed repair
        run: python .github/z_vector_apply_repair.py
      - name: Verify exact repair
        run: |
          python -m py_compile reward_reconciliation.py tests/test_reward_reconciliation.py tests/test_reward_reconciliation_hardening.py tests/test_reward_reconciliation_input_boundary.py
          python -m unittest -v tests.test_reward_reconciliation tests.test_reward_reconciliation_hardening tests.test_reward_reconciliation_input_boundary
          python -O -m unittest -v tests.test_reward_reconciliation tests.test_reward_reconciliation_hardening tests.test_reward_reconciliation_input_boundary
          tmp="$(mktemp -d)"
          python reward_reconciliation.py compile examples/reward-observations.example.json --json-out "$tmp/report.json" --markdown-out "$tmp/report.md"
          python reward_reconciliation.py verify examples/reward-observations.example.json "$tmp/report.json"
      - name: Commit verified donor bytes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/z-vector-reconciliation-nlink-repair.yml .github/z_vector_apply_repair.py
          git add reward_reconciliation.py tests/test_reward_reconciliation_input_boundary.py docs/reward-reconciliation.md
          git commit -m "fix: reject hard-linked reconciliation trust roots [skip ci]"
          git push origin HEAD:z-vector/reconciliation-nlink-repair-20260914
